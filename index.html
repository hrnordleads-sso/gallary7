<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diet Soda | Pure Zero Refreshment</title>
    <meta name="description" content="Experience the crisp, clean taste of Diet Soda. Zero sugar, zero compromise.">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;700;900&family=Inter:wght@400;500&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
:root {
    --bg-color: #0a0a0a;
    --text-color: #ffffff;
    --accent-color: #ffffff;
    --muted-color: rgba(255, 255, 255, 0.7);
    --glass-bg: rgba(255, 255, 255, 0.05);
    --glass-border: rgba(255, 255, 255, 0.1);
    --font-main: 'Inter', sans-serif;
    --font-heading: 'Galada', cursive;

    /* Dynamic Background Variables */
    --bg-inner: #0b8a78;
    --bg-mid: #044e3b;
    --bg-outer: #011411;
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: radial-gradient(circle at center, var(--bg-inner) 0%, var(--bg-mid) 50%, var(--bg-outer) 100%);
    color: var(--text-color);
    font-family: var(--font-main);
    overflow: hidden; /* Remove scroll */
    height: 100vh;
    transition: background 1.2s cubic-bezier(0.4, 0, 0.2, 1);
}

body.blue-theme {
    --bg-inner: #0b4f8a;
    --bg-mid: #04294e;
    --bg-outer: #010c14;
}

#bubbles-container {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
}

.bubble-img {
    position: absolute;
    pointer-events: none;
}

@keyframes floatUpImg {
    0% {
        transform: translateY(0) translateX(0) rotate(0deg);
        opacity: 0;
    }
    10% { opacity: 0.4; }
    90% { opacity: 0.4; }
    100% {
        transform: translateY(-110vh) translateX(30px) rotate(360deg);
        opacity: 0;
    }
}

.header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 2rem 4%;
    position: fixed;
    top: 0;
    width: 100%;
    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-weight: 700;
    font-size: 1.2rem;
    font-family: var(--font-heading);
    position: relative;
    z-index: 120;
}

.nav-shell {
    display: contents;
}

.nav-toggle {
    display: none;
    position: relative;
    z-index: 120;
    width: 44px;
    height: 44px;
    border: 1px solid rgba(255, 255, 255, 0.22);
    border-radius: 999px;
    background: rgba(0, 0, 0, 0.45);
    color: white;
    cursor: pointer;
    align-items: center;
    justify-content: center;
    padding: 0;
    flex-shrink: 0;
}

.nav-toggle-box {
    display: flex;
    flex-direction: column;
    gap: 5px;
    width: 18px;
}

.nav-toggle-bar {
    display: block;
    height: 2px;
    width: 100%;
    border-radius: 2px;
    background: currentColor;
    transition: transform 0.25s ease, opacity 0.2s ease;
}

body.nav-open .nav-toggle-bar:nth-child(1) {
    transform: translateY(7px) rotate(45deg);
}

body.nav-open .nav-toggle-bar:nth-child(2) {
    opacity: 0;
}

body.nav-open .nav-toggle-bar:nth-child(3) {
    transform: translateY(-7px) rotate(-45deg);
}

.nav-backdrop {
    display: none;
}

.nav {
    display: flex;
    gap: 0.5rem;
    flex-wrap: nowrap;
    background: var(--glass-bg);
    padding: 0.4rem;
    border-radius: 100px;
    border: 1px solid var(--glass-border);
}

.nav.glass {
    position: relative;
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(255, 255, 255, 0.2);
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1), inset 0 0 0 1px rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
}

.nav-item {
    font-family: 'Manrope', sans-serif;
    color: var(--muted-color);
    text-decoration: none;
    font-size: 0.85rem;
    font-weight: 500;
    padding: 0.5rem 1.2rem;
    border-radius: 100px;
    transition: all 0.3s ease;
    white-space: nowrap;
}

.nav-item:hover,
.nav-item.active {
    background: #fbcfe8;
    color: #011d17;
}

.contact-btn {
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 0.9rem 2rem;
    border-radius: 100px;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: none;
}

.contact-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: translateY(-2px);
    box-shadow: none;
}

.hero {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 4%;
    padding-top: 5rem;
}

.hero-content {
    display: flex;
    justify-content: space-between;
    align-items: stretch; /* Stretch columns to full height */
    width: 100%;
    max-width: 100%;
    padding: 0;
    height: 100%;
    position: relative;
}

/* Typography */
.main-title,
.side-title {
    font-family: var(--font-heading);
    font-size: clamp(5rem, 10vw, 12rem);
    line-height: 0.8;
    font-weight: 400;
    text-transform: none;
    white-space: nowrap;
    color: white;
    letter-spacing: normal;
}

.outline {
    color: var(--text-color);
}

.leaves-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: -1; /* Even further behind */
    transition: transform 0.1s ease-out;
}

.leaf {
    position: absolute;
    width: 60px;
    height: 60px;
    pointer-events: none;
    z-index: -1;
    filter: drop-shadow(0 5px 15px rgba(0, 0, 0, 0.2));
}

.l1 { top: 10%; left: 15%; }
.l2 { top: 40%; left: 80%; width: 140px; height: 140px; opacity: 0.4; }
.l3 { top: 70%; left: 75%; width: 80px; height: 80px; }
.l4 { top: 85%; left: 20%; width: 120px; height: 120px; opacity: 0.3; }

.hero-left {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 6rem 0;
    gap: 2rem;
    z-index: 100;
}

@keyframes fadeInEntry {
    to { opacity: 1; transform: none; }
}

.description {
    color: var(--muted-color);
    font-size: 1.1rem;
    line-height: 1.6;
    max-width: 400px;
}

.primary-btn {
    display: flex;
    align-items: center;
    gap: 1.5rem;
    background: rgba(0, 0, 0, 0.5);
    color: white;
    border: none;
    padding: 0.4rem 0.4rem 0.4rem 1.5rem;
    border-radius: 100px;
    font-weight: 700;
    cursor: pointer;
    width: fit-content;
    transition: all 0.3s ease;
    box-shadow: none;
    text-decoration: none;
}

.primary-btn:hover {
    background: rgba(0, 0, 0, 0.7);
    transform: translateY(-3px);
    box-shadow: none;
}

.plus-icon {
    background: #fbcfe8;
    color: #011d17;
    width: 38px;
    height: 38px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    font-size: 1.4rem;
    font-weight: 900;
    line-height: 1;
    padding-bottom: 2px; /* Compensate for baseline shift */
    border: none;
}

.award-badge {
    display: flex;
    align-items: center;
    gap: 1rem;
    margin-top: auto; /* Push to bottom */
}

.award-icon {
    width: 48px;
    height: 48px;
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
}

.award-text { display: flex; flex-direction: column; }
.award-title { font-size: 0.7rem; letter-spacing: 0.1em; color: var(--muted-color); }
.award-subtitle { font-size: 0.85rem; font-weight: 600; }

.hero-center {
    display: flex;
    justify-content: center;
    align-items: center;
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    opacity: 0;
    animation: fadeIn 1.5s ease-out 0.3s forwards, float 6s ease-in-out infinite;
    pointer-events: none;
    background: radial-gradient(circle at center, rgba(16, 185, 129, 0.1) 0%, transparent 70%);
}

@keyframes fadeIn { to { opacity: 1; } }

@keyframes float {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-20px); }
}

.main-product-3d {
    width: 80vw;
    height: 80vh;
    outline: none;
    --progress-bar-color: transparent;
    --poster-color: transparent;
    z-index: 1;
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) rotate(25deg);
    pointer-events: none;
}

.main-product-3d[camera-controls] { pointer-events: auto; }

.berries-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 110; /* Above text (100) and can (50) */
    transition: transform 0.1s ease-out;
}

.berries-container-bg {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0; /* Behind everything */
    transition: transform 0.1s ease-out;
}

.berry {
    position: absolute;
    width: 120px;
    height: 120px;
    outline: none;
    --progress-bar-color: transparent;
    filter: drop-shadow(0 10px 20px rgba(0, 0, 0, 0.3));
    transition: transform 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
}

.berry.no-animation { animation: none !important; }

.b1 { top: 25%; left: 30%; width: 220px; height: 220px; }
.b2 { top: 60%; left: 42%; width: 100px; height: 100px; }
.b3 { top: 30%; left: 62%; width: 250px; height: 250px; }
.b4 { top: 15%; left: 48%; width: 140px; height: 140px; }
.b5 { top: 75%; left: 20%; width: 120px; height: 120px; }
.b6 { top: 45%; left: 75%; width: 180px; height: 180px; }
.b7 { top: 15%; left: 40%; width: 80px; height: 80px; opacity: 0.7; }
.b8 { top: 50%; left: 55%; width: 70px; height: 70px; opacity: 0.6; }
.b9 { top: 80%; left: 35%; width: 75px; height: 75px; opacity: 0.7; }

.hero-right {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: flex-end;
    text-align: right;
    height: 100%;
    padding: 6rem 0;
    z-index: 100;
    width: 450px;
    pointer-events: none;
}

@keyframes fadeInLeft {
    to { opacity: 1; transform: translateX(0); }
}

.product-carousel {
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    align-items: flex-end;
    pointer-events: auto; /* Enable interaction */
}

.carousel-cards { display: flex; gap: 1rem; }

.card {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    padding: 1rem;
    padding-top: 5rem;
    border-radius: 28px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 1.5rem;
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    width: 135px;
    position: relative;
    backdrop-filter: blur(10px);
    text-align: center;
}

.card:hover {
    background: rgba(255, 255, 255, 0.12);
    border-color: rgba(255, 255, 255, 0.4);
}

.card.active {
    border-color: #fbcfe8;
    border-width: 1px;
    background: var(--glass-bg);
    box-shadow: none;
}

.card img {
    width: 140px;
    height: auto;
    margin-top: -8rem;
    filter: drop-shadow(0 20px 35px rgba(0, 0, 0, 0.5));
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) !important;
    display: block;
    will-change: transform;
    pointer-events: none; /* Mouse passes through image to trigger card hover */
}

.card:hover img {
    transform: translateY(-30px) rotate(-12deg) scale(1.15) !important;
}

.card-info {
    display: flex;
    flex-direction: column;
    font-size: 0.7rem;
    width: 100%;
    word-wrap: break-word;
}

.card-info span:first-child { font-weight: 600; }
.card-info span:last-child { color: var(--muted-color); }

.carousel-nav { display: flex; gap: 1rem; }

.nav-arrow {
    background: var(--glass-bg);
    border: 1px solid var(--glass-border);
    color: white;
    width: 36px;
    height: 36px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.3s;
}

.nav-arrow:hover { background: rgba(255, 255, 255, 0.1); }

.side-title { align-self: flex-end; text-align: right; }

@keyframes shine {
    from { transform: translateX(-100%) rotate(45deg); }
    to { transform: translateX(200%) rotate(45deg); }
}

@media (max-width: 1200px) {
    .main-product-3d { width: 100vw; height: 60vh; top: 40%; }
}

@media (max-width: 1200px) {
    .hero-content { grid-template-columns: 1fr; padding-top: 8rem; }
    .hero-center { order: -1; }
    .main-title, .side-title { font-size: 5rem; }
    .hero-right { align-items: center; text-align: center; }
    .side-title { align-self: center; text-align: center; }
}

/* Phase A1 — phone homepage layout only (desktop unchanged) */
@media (max-width: 768px) {
    html, body {
        overflow-x: hidden;
        max-width: 100vw;
    }

    body {
        height: 100svh;
    }

    .header {
        padding: 0.7rem 3%;
        gap: 0.75rem;
        align-items: center;
        flex-wrap: nowrap;
        min-height: 3.75rem;
    }

    .logo {
        font-size: 1.05rem;
        flex-shrink: 0;
    }

    .logo svg {
        width: 26px;
        height: 26px;
    }

    .nav-toggle {
        display: inline-flex;
        margin-left: auto;
    }

    .nav-shell {
        display: flex;
        flex-direction: column;
        align-items: stretch;
        gap: 0.75rem;
        position: fixed;
        top: 0;
        right: 0;
        width: min(20rem, 86vw);
        height: 100svh;
        padding: 4.75rem 1.1rem 1.5rem;
        background: rgba(1, 20, 17, 0.94);
        border-left: 1px solid rgba(255, 255, 255, 0.12);
        box-shadow: -18px 0 48px rgba(0, 0, 0, 0.45);
        backdrop-filter: blur(22px);
        -webkit-backdrop-filter: blur(22px);
        transform: translateX(105%);
        visibility: hidden;
        pointer-events: none;
        transition: transform 0.28s ease, visibility 0.28s ease;
        z-index: 110;
        overflow-y: auto;
    }

    body.nav-open .nav-shell {
        transform: translateX(0);
        visibility: visible;
        pointer-events: auto;
    }

    body.blue-theme .nav-shell {
        background: rgba(1, 12, 20, 0.94);
    }

    .nav.glass {
        flex-direction: column;
        flex-wrap: nowrap;
        width: 100%;
        max-width: none;
        overflow: visible;
        border-radius: 1.25rem;
        padding: 0.45rem;
        gap: 0.25rem;
    }

    .nav-item {
        width: 100%;
        text-align: left;
        font-size: 0.95rem;
        padding: 0.85rem 1rem;
        border-radius: 0.9rem;
    }

    .contact-btn {
        width: 100%;
        padding: 0.9rem 1rem;
        font-size: 0.9rem;
    }

    /* Backdrop must sit BELOW .header stacking context (z-index 100+).
       Previously z-index 105 covered the drawer and ate all link taps. */
    .nav-backdrop {
        display: block;
        position: fixed;
        inset: 0;
        z-index: 90;
        border: 0;
        padding: 0;
        margin: 0;
        background: rgba(0, 0, 0, 0.45);
        cursor: pointer;
    }

    .nav-backdrop[hidden] {
        display: none !important;
    }

    body.nav-open .header {
        z-index: 200;
    }

    body.nav-open {
        overflow: hidden;
    }

    .hero {
        height: 100svh;
        padding: 4rem 4% 0.55rem;
        align-items: stretch;
    }

    .hero-content {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: stretch;
        height: 100%;
        padding-top: 0;
        gap: 0.2rem;
    }

    /* Undo tablet rule `.hero-center { order: -1 }` so copy stays first */
    .leaves-container { order: 0; }
    .hero-left { order: 1; }
    .berries-container-bg { order: 2; }
    .hero-center { order: 3; }
    .berries-container { order: 4; }
    .hero-right { order: 5; }

    /* Copy above 3D — readable */
    .hero-left {
        position: relative;
        z-index: 30;
        flex: 0 0 auto;
        height: auto;
        min-height: 0;
        padding: 0;
        gap: 0.45rem;
        max-width: 100%;
        pointer-events: none;
    }

    .hero-left .cta-group,
    .hero-left .primary-btn {
        pointer-events: auto;
    }

    .main-title {
        font-size: clamp(2.6rem, 12vw, 3.6rem);
        line-height: 0.9;
        white-space: normal;
        max-width: 100%;
        text-shadow: 0 2px 20px rgba(1, 20, 17, 0.9), 0 0 2px rgba(0, 0, 0, 0.55);
    }

    .description {
        font-size: 0.86rem;
        line-height: 1.4;
        max-width: 19.5rem;
        text-shadow: 0 2px 16px rgba(1, 20, 17, 0.88);
    }

    .primary-btn {
        padding: 0.3rem 0.3rem 0.3rem 1.1rem;
        gap: 1rem;
        font-size: 0.85rem;
    }

    .plus-icon {
        width: 32px;
        height: 32px;
        font-size: 1.2rem;
    }

    .award-badge {
        display: none; /* frees vertical space on phone; desktop unchanged */
    }

    /*
      Can lives in normal flex flow (not full-bleed absolute overlay),
      so it cannot cover CTA cards / side title.
    */
    .hero-center {
        position: relative;
        left: auto;
        top: auto;
        width: 100%;
        flex: 0 0 auto;
        height: 23svh;
        margin: 0.9rem 0 0.45rem;
        z-index: 5;
        opacity: 1;
        animation: fadeIn 1.2s ease-out 0.2s forwards;
        background: radial-gradient(circle at center, rgba(16, 185, 129, 0.12) 0%, transparent 68%);
        pointer-events: none;
        display: flex;
        align-items: center;
        justify-content: center;
        order: 3;
        overflow: visible;
    }

    .main-product-3d {
        position: relative !important;
        width: min(52vw, 190px);
        height: min(22svh, 190px);
        max-height: 22svh;
        top: auto !important;
        left: auto !important;
        transform: rotate(10deg);
        z-index: 5;
        pointer-events: none;
        animation: float 6s ease-in-out infinite;
    }

    .main-product-3d[camera-controls] {
        pointer-events: auto;
    }

    /* A2: leaves + BG berries not mounted on phone; FG keeps ≤3 small berries in can band */
    .berries-container-bg,
    .leaves-container {
        display: none !important;
    }

    .berries-container {
        display: block;
        z-index: 6;
        pointer-events: none;
    }

    .berries-container .berry {
        width: 54px;
        height: 54px;
        opacity: 0.42;
    }

    .berries-container .b1 {
        top: 46%;
        left: 6%;
    }

    .berries-container .b4 {
        top: 50%;
        left: auto;
        right: 5%;
    }

    .berries-container .b6 {
        top: 58%;
        left: 72%;
    }

    .hero-right {
        position: relative;
        z-index: 30;
        flex: 0 0 auto;
        width: 100%;
        height: auto;
        padding: 0 0 0.35rem;
        margin-top: 0.15rem;
        align-items: center;
        text-align: center;
        pointer-events: none;
        gap: 0.25rem;
        order: 5;
    }

    .product-carousel {
        align-items: center;
        width: 100%;
        gap: 0.3rem;
        pointer-events: auto;
    }

    .carousel-cards {
        justify-content: center;
        gap: 0.5rem;
    }

    .card {
        width: 88px;
        padding: 0.45rem;
        padding-top: 2.4rem;
        border-radius: 18px;
        gap: 0.35rem;
    }

    .card img {
        width: 78px;
        margin-top: -3.9rem;
    }

    .card:hover img {
        transform: translateY(-8px) rotate(-7deg) scale(1.04) !important;
    }

    .carousel-nav {
        justify-content: center;
        gap: 0.55rem;
    }

    .nav-arrow {
        width: 28px;
        height: 28px;
    }

    .side-title {
        align-self: center;
        text-align: center;
        width: 100%;
        max-width: 100%;
        font-size: clamp(1.45rem, 6.2vw, 1.95rem);
        line-height: 1.05;
        white-space: normal; /* G7-02: prevent cut-off */
        padding: 0 0.75rem env(safe-area-inset-bottom, 0.3rem);
        margin: 0.15rem 0 0.25rem;
        overflow: visible;
        text-shadow: 0 2px 18px rgba(1, 20, 17, 0.88);
    }
}

/* Phase A6 — reduced motion + model load polish */
model-viewer.mv-pending { opacity: 0.35; transition: opacity 0.35s ease; }
model-viewer.mv-ready { opacity: 1; }
model-viewer.mv-failed {
    opacity: 0;
    pointer-events: none;
    position: absolute !important;
    width: 1px !important;
    height: 1px !important;
}
.mv-fallback {
    display: grid;
    place-items: center;
    text-align: center;
    gap: 0.5rem;
}
.mv-fallback[hidden] { display: none !important; }
.mv-fallback-img {
    width: min(42vw, 180px);
    height: auto;
    filter: drop-shadow(0 18px 30px rgba(0, 0, 0, 0.45));
    transform: rotate(14deg);
}
.mv-fallback-copy {
    color: var(--muted-color);
    font-size: 0.85rem;
}

@media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .main-product-3d,
    .berry,
    .leaf,
    .bubble-img,
    .mv-fallback-img {
        animation: none !important;
        transition: none !important;
    }
}
    </style>
</head>

    <svg style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;">
        <filter id="frosted">
            <feTurbulence type="fractalNoise" baseFrequency="0.0125" numOctaves="3" result="noise" />

    <div style="display: none;">

    <script src="soda-nav.js"></script>
    <!-- Phase A2: strip desktop-only viewers before deferred model-viewer module runs -->
    <script src="soda-mv-gate.js"></script>
    <script src="soda-assets.js"></script>
    <script src="soda-model-ux.js"></script>

    <script>
const isPhone = !!(window.SodaMvGate && window.SodaMvGate.isPhone);
const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const modelViewer = document.querySelector('#product-model');
const berriesFG = document.querySelector('.berries-container');
const berriesBG = document.querySelector('.berries-container-bg');
const leavesBG = document.querySelector('.leaves-container');
const allBerries = document.querySelectorAll('.berry');
const cards = document.querySelectorAll('.card');
let isSwitching = false;
let switchSpin = 0;
let blueTexture = null;
let greenTexture = null;

// Preload textures & Warm up shaders
modelViewer.addEventListener('load', async () => {
    try {
        blueTexture = await modelViewer.createTexture('assets/blue-base-color.jpg');
        greenTexture = await modelViewer.createTexture('assets/green-base-color.jpg');

        // Shader Warm-up: Briefly apply textures to compile shaders
        if (modelViewer.model) {
            const material = modelViewer.model.materials[0];
            if (material && material.pbrMetallicRoughness.baseColorTexture) {
                // Apply blue
                material.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
                await new Promise(r => requestAnimationFrame(r));
                // Apply green back
                material.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture);
            }
        }
    } catch (e) { console.error("Texture preload failed", e); }
});

function activateFlavor(flavor) {
    const target = flavor === 'blue' ? 'blue' : 'classic';
    const active = document.querySelector('.card.active');
    if (active && active.dataset.flavor === target) return;
    switchFlavor(target);
}

cards.forEach(card => {
    card.addEventListener('click', () => {
        activateFlavor(card.dataset.flavor);
    });
});

const navArrows = document.querySelectorAll('.nav-arrow');
const flavorOrder = ['classic', 'blue'];
if (navArrows[0]) {
    navArrows[0].addEventListener('click', () => {
        const active = document.querySelector('.card.active');
        const current = active?.dataset.flavor || 'classic';
        const idx = flavorOrder.indexOf(current);
        const prev = flavorOrder[(idx - 1 + flavorOrder.length) % flavorOrder.length];
        activateFlavor(prev);
    });
}
if (navArrows[1]) {
    navArrows[1].addEventListener('click', () => {
        const active = document.querySelector('.card.active');
        const current = active?.dataset.flavor || 'classic';
        const idx = flavorOrder.indexOf(current);
        const next = flavorOrder[(idx + 1) % flavorOrder.length];
        activateFlavor(next);
    });
}

async function switchFlavor(flavor) {
    if (isSwitching) return;
    isSwitching = true;
    const target = flavor === 'blue' ? 'blue' : 'classic';
    cards.forEach(c => c.classList.toggle('active', c.dataset.flavor === target));

    const body = document.body;
    const berries = document.querySelectorAll('.berry');
    const heroCenter = document.querySelector('.hero-center');
    const berrySrc = target === 'blue'
        ? 'assets/blueberry.glb'
        : 'assets/cherry.glb';

    // Keep theme + lock in sync even if GSAP/rAF stalls under heavy desktop MV load
    if (target === 'blue') body.classList.add('blue-theme');
    else body.classList.remove('blue-theme');

    const targetColors = target === 'blue' ?
        { inner: '#0b4f8a', mid: '#04294e', outer: '#010c14' } :
        { inner: '#0b8a78', mid: '#044e3b', outer: '#011411' };

    // G7-15: keep flavor switch functional without spin/blur motion
    if (prefersReducedMotion) {
        body.style.setProperty('--bg-inner', targetColors.inner);
        body.style.setProperty('--bg-mid', targetColors.mid);
        body.style.setProperty('--bg-outer', targetColors.outer);
        const tex = target === 'blue' ? blueTexture : greenTexture;
        if (modelViewer.model && tex) {
            modelViewer.model.materials.forEach((material) => {
                if (material.pbrMetallicRoughness.baseColorTexture) {
                    material.pbrMetallicRoughness.baseColorTexture.setTexture(tex);
                }
            });
        }
        berries.forEach((berry) => { berry.src = berrySrc; });
        isSwitching = false;
        return;
    }

    const unlockSwitch = () => {
        isSwitching = false;
        switchSpin = 0;
        modelViewer.style.filter = 'none';
    };
    const unlockTimer = setTimeout(unlockSwitch, 2500);

    // 1. Background Animation
    gsap.to(body, {
        '--bg-inner': targetColors.inner,
        '--bg-mid': targetColors.mid,
        '--bg-outer': targetColors.outer,
        duration: 1.5,
        ease: 'power2.inOut'
    });

    // 2. Can Spin Animation (Simple 360 spin + blur with back settle)
    const spinObj = { val: 0, blur: 0 };
    gsap.to(spinObj, {
        val: 360,
        blur: 15,
        duration: 0.6,
        ease: "power2.in",
        onUpdate: () => {
            switchSpin = spinObj.val;
            modelViewer.style.filter = `blur(${spinObj.blur}px)`;
        },
        onComplete: async () => {
            // SWAP at peak (theme class already applied above)
            if (target === 'blue') {
                if (modelViewer.model && blueTexture) {
                    modelViewer.model.materials.forEach(material => {
                        if (material.pbrMetallicRoughness.baseColorTexture) {
                            material.pbrMetallicRoughness.baseColorTexture.setTexture(blueTexture);
                        }
                    });
                }
            } else {
                if (modelViewer.model && greenTexture) {
                    modelViewer.model.materials.forEach(material => {
                        if (material.pbrMetallicRoughness.baseColorTexture) {
                            material.pbrMetallicRoughness.baseColorTexture.setTexture(greenTexture);
                        }
                    });
                }
            }

            gsap.to(spinObj, {
                val: 720,
                blur: 0,
                duration: 1.5,
                ease: "back.out(0.7)",
                onUpdate: () => {
                    switchSpin = spinObj.val;
                    modelViewer.style.filter = `blur(${spinObj.blur}px)`;
                },
                onComplete: () => {
                    switchSpin = 0;
                    modelViewer.style.filter = 'none';
                    clearTimeout(unlockTimer);
                    unlockSwitch();
                }
            });
        }
    });

    // 3. Berries "Hide & Reveal" with Dynamic Positioning
    if (!berries.length) {
        // Can-spin onComplete still unlocks; keep a safety if spin is skipped
        return;
    }

    berries.forEach((berry) => {
        gsap.killTweensOf(berry);

        const bW = berry.offsetWidth / 2;
        const bH = berry.offsetHeight / 2;
        const centerX = (window.innerWidth / 2 - berry.offsetLeft - bW);
        const centerY = (window.innerHeight / 2 - berry.offsetTop - bH);

        const startAngle = parseFloat(berry.dataset.angle) || 0;
        const currentBaseX = parseFloat(berry.dataset.baseX) || 0;
        const currentBaseY = parseFloat(berry.dataset.baseY) || 0;

        // New random target position - Increased range for visibility
        const nextBaseX = (Math.random() - 0.5) * 200;
        const nextBaseY = (Math.random() - 0.5) * 200;

        gsap.set(berry, {
            rotation: startAngle,
            x: currentBaseX,
            y: currentBaseY
        });

        const berryTl = gsap.timeline();

        berryTl.to(berry, {
            x: centerX,
            y: centerY,
            rotation: startAngle + 45,
            scale: 0.1,
            opacity: 0,
            duration: 0.5,
            ease: "power2.in",
            onComplete: () => {
                berry.src = berrySrc;
                heroCenter.style.zIndex = 50;
            }
        })
        .to(berry, {
            duration: 0.3
        })
        .to(berry, {
            onStart: () => {
                heroCenter.style.zIndex = 1;
            },
            x: nextBaseX,
            y: nextBaseY,
            rotation: startAngle + 90,
            scale: 1,
            opacity: 1,
            duration: 0.9,
            ease: "back.out(1.5)",
            onComplete: () => {
                berry.dataset.angle = startAngle + 90;
                berry.dataset.baseX = nextBaseX;
                berry.dataset.baseY = nextBaseY;
                berry.dataset.rx = 0;
                berry.dataset.ry = 0;
            }
        });
    });
}


// Track berry states for smoothing
allBerries.forEach(b => {
    b.dataset.rx = 0; b.dataset.ry = 0; b.dataset.angle = Math.random() * 360;
    b.dataset.baseX = 0; b.dataset.baseY = 0;
    b.dataset.targetRx = 0; b.dataset.targetRy = 0;
});

let mouse = { x: 0, y: 0, px: 0, py: 0 };
let currentMouse = { x: 0, y: 0 };

window.addEventListener('mousemove', (e) => {
    mouse.x = (e.clientX / window.innerWidth) - 0.5;
    mouse.y = (e.clientY / window.innerHeight) - 0.5;
    mouse.px = e.clientX;
    mouse.py = e.clientY;
});

function animate() {
    const time = Date.now() * 0.001;
    currentMouse.x += (mouse.x - currentMouse.x) * 0.05;
    currentMouse.y += (mouse.y - currentMouse.y) * 0.05;

    if (modelViewer) {
        const yawAmp = isPhone ? 24 : 40;
        const pitchAmp = isPhone ? 12 : 20;
        const dist = isPhone ? '320%' : '380%';
        modelViewer.cameraOrbit = `${(currentMouse.x * yawAmp) + switchSpin}deg ${90 + (currentMouse.y * pitchAmp)}deg ${dist}`;
    }

    if (berriesFG) {
        berriesFG.style.transform = `translate(${currentMouse.x * (isPhone ? 28 : 60)}px, ${currentMouse.y * (isPhone ? 28 : 60)}px)`;
    }
    if (berriesBG && !isPhone) {
        berriesBG.style.transform = `translate(${currentMouse.x * -30}px, ${currentMouse.y * -30}px)`;
    }
    if (leavesBG && !isPhone) {
        leavesBG.style.transform = `translate(${currentMouse.x * -15}px, ${currentMouse.y * -15}px)`;
    }

    // Phone: light float only (skip expensive per-berry repulsion + getBoundingClientRect)
    if (!isSwitching) {
        allBerries.forEach((berry, i) => {
            if (isPhone) {
                const dur = 5 + (i % 3);
                const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
                const floatY = Math.sin(phase) * 10;
                const floatAngle = Math.cos(phase) * 4;
                berry.style.transform = `translateY(${floatY}px) rotate(${floatAngle}deg)`;
                return;
            }

            const berryRect = berry.getBoundingClientRect();
            const berryX = berryRect.left + berryRect.width / 2;
            const berryY = berryRect.top + berryRect.height / 2;

            const diffX = mouse.px - berryX;
            const diffY = mouse.py - berryY;
            const distance = Math.sqrt(diffX * diffX + diffY * diffY);

            let targetRx = 0, targetRy = 0, speedMult = 1;

            if (distance < 400) {
                const force = (400 - distance) / 400;
                targetRx = (diffX / distance) * force * -80;
                targetRy = (diffY / distance) * force * -80;
                speedMult = 1 + force * 5;
            }

            let rx = parseFloat(berry.dataset.rx) || 0;
            let ry = parseFloat(berry.dataset.ry) || 0;
            let angle = parseFloat(berry.dataset.angle) || 0;
            let baseX = parseFloat(berry.dataset.baseX) || 0;
            let baseY = parseFloat(berry.dataset.baseY) || 0;

            rx += (targetRx - rx) * 0.1;
            ry += (targetRy - ry) * 0.1;
            angle += 0.2 * speedMult;

            berry.dataset.rx = rx;
            berry.dataset.ry = ry;
            berry.dataset.angle = angle;

            const dur = [5, 7, 6, 8, 5.5, 6.5, 9, 11, 10][i % 9];
            const phase = (time + i * 0.7) * (Math.PI * 2 / dur);
            const floatY = Math.sin(phase) * 15;
            const floatAngle = Math.cos(phase) * 6;

            berry.style.transform = `translate(calc(${rx + baseX}px), calc(${ry + baseY}px + ${floatY}px)) rotate(calc(${angle}deg + ${floatAngle}deg))`;
        });
    }

    if (!isPhone) {
        document.querySelectorAll('.leaf').forEach((leaf, i) => {
            const dur = 10 + i * 2;
            const phase = (time + i * 1.2) * (Math.PI * 2 / dur);
            const floatY = Math.sin(phase) * 20;
            const floatX = Math.cos(phase * 0.5) * 15;
            const floatAngle = Math.sin(phase * 0.3) * 15;
            leaf.style.transform = `translate(${floatX}px, ${floatY}px) rotate(${floatAngle}deg)`;
        });
    }

    requestAnimationFrame(animate);
}

if (!prefersReducedMotion) {
    animate();
}

// Bubbles Generator using bubble.png (disabled under reduced motion)
const bubblesContainer = document.getElementById('bubbles-container');
const bubbleCap = isPhone ? 6 : 18;
const bubbleEvery = isPhone ? 900 : 400;
function createBubble() {
    if (!bubblesContainer || prefersReducedMotion) return;
    if (bubblesContainer.childElementCount >= bubbleCap) return;
    const bubble = document.createElement('img');
    bubble.src = (window.SodaAssets && SodaAssets.bubble) || 'assets/bubble.png';
    bubble.className = 'bubble-img';
    bubble.alt = '';
    const size = Math.random() * 20 + 10 + 'px';
    bubble.style.width = size;
    bubble.style.height = 'auto';
    bubble.style.left = Math.random() * 100 + '%';
    bubble.style.bottom = '-50px';
    bubble.style.opacity = Math.random() * 0.4 + 0.2;

    const duration = Math.random() * 6 + 4;
    bubble.style.animation = `floatUpImg ${duration}s linear forwards`;

    bubblesContainer.appendChild(bubble);
    setTimeout(() => bubble.remove(), duration * 1000);
}
if (!prefersReducedMotion) {
    setInterval(createBubble, bubbleEvery);
}
    </script>
