<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Diet Soda</title>
    <meta name="description" content="Contact Pure Zero — premium animated hero with a working message form.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;700&family=Galada&display=swap" rel="stylesheet">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon.png" type="image/png" sizes="32x32">
    <link rel="shortcut icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="favicon.png">
    <link rel="stylesheet" href="site.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
</head>
<body>
    <div id="bubbles-container"></div>

    <header class="header">
        <a class="logo" href="index.html">
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="10" stroke="currentColor" stroke-width="2"/><path d="M12 8V16M8 12H16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            <span>Soda</span>
        </a>
        <button type="button" class="nav-toggle" aria-controls="site-nav" aria-expanded="false" aria-label="Open menu">
            <span class="nav-toggle-box" aria-hidden="true">
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
                <span class="nav-toggle-bar"></span>
            </span>
        </button>
        <div class="nav-shell" id="site-nav">
            <nav class="nav" aria-label="Primary">
                <a href="index.html" class="nav-item">Home</a>
                <a href="ingredients.html" class="nav-item">Ingredients</a>
                <a href="taste.html" class="nav-item">Taste</a>
                <a href="eco.html" class="nav-item">Eco</a>
                <a href="reviews.html" class="nav-item">Reviews</a>
            </nav>
            <a class="contact-btn" href="contact.html" aria-current="page">Contact Us</a>
        </div>
    </header>

    <main class="cinema">
        <section class="cinema-hero">
            <div class="cinema-copy reveal">
                <p class="page-kicker">Say hello</p>
                <h1 class="page-title">Let’s keep<br>it cold</h1>
                <p class="page-lead">
                    Wholesale, press, or just a note about your favorite flavor — send a message and we’ll get back fast.
                </p>

                <form class="glass-card contact-form" id="contact-form" action="mailto:hello@dietsoda.example" method="post" enctype="text/plain" novalidate>
                    <p class="form-hint">
                        This form opens your email app with a drafted message. Nothing is sent from this website.
                    </p>
                    <label for="contact-name">
                        Name
                        <input id="contact-name" name="name" type="text" autocomplete="name" required placeholder="Your name" aria-describedby="err-name">
                        <span class="field-error" id="err-name" role="alert"></span>
                    </label>
                    <label for="contact-email">
                        Email
                        <input id="contact-email" name="email" type="email" autocomplete="email" required placeholder="you@brand.com" aria-describedby="err-email">
                        <span class="field-error" id="err-email" role="alert"></span>
                    </label>
                    <label for="contact-message">
                        Message
                        <textarea id="contact-message" name="message" required placeholder="Tell us what you’re after" aria-describedby="err-message"></textarea>
                        <span class="field-error" id="err-message" role="alert"></span>
                    </label>
                    <button class="primary-btn" type="submit">
                        Send message
                        <span class="plus-icon">+</span>
                    </button>
                    <p class="form-note" id="form-status" role="status" aria-live="polite"></p>
                </form>
            </div>

            <div class="stage">
                <div class="stage-glow"></div>
                <model-viewer class="berry-orb b-a" id="berry-a" src="assets/cherry.glb" environment-image="neutral" exposure="1.05" interaction-prompt="none"></model-viewer>
                <model-viewer class="leaf-orb l-a" data-mv-desktop-only src="assets/leaves.glb" environment-image="neutral" exposure="1.0" interaction-prompt="none"></model-viewer>
                <model-viewer
                    id="contact-can"
                    class="soda-can"
                    src="assets/deit_soda2.glb"
                    poster="assets/green-soda.png"
                    alt="Diet Soda contact hero"
                    shadow-intensity="0"
                    environment-image="neutral"
                    exposure="1.5"
                    interaction-prompt="none"
                    camera-orbit="12deg 90deg 360%"
                    field-of-view="30deg"
                    disable-zoom>
                </model-viewer>
            </div>
        </section>
    </main>

    <script src="soda-nav.js"></script>
    <script src="soda-mv-gate.js"></script>
    <script src="soda-assets.js"></script>
    <script src="soda-model-ux.js"></script>
    <script src="soda-core.js"></script>
    <script>
      const isPhone = !!(window.SodaMvGate && window.SodaMvGate.isPhone);
      const live = SodaSite.bootSecondary({ flavor: "classic" });
      const can = document.getElementById("contact-can");
      const berry = document.getElementById("berry-a");
      const form = document.getElementById("contact-form");
      const status = document.getElementById("form-status");
      const nameInput = document.getElementById("contact-name");
      const emailInput = document.getElementById("contact-email");
      const messageInput = document.getElementById("contact-message");
      const emailPattern = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (can) {
        live.bindPointerTilt(can, {
          yawAmp: isPhone ? 18 : 30,
          pitchAmp: isPhone ? 9 : 12,
          distance: isPhone ? "300%" : "360%",
        });
        can.addEventListener("load", async () => {
          await live.preloadTextures(can);
          live.applyCanTexture(can, "classic");
        });
      }
      if (berry) {
        live.floatBerries([berry]);
      }
      live.revealOnScroll(".reveal", { y: 28, start: "top 95%" });

      function setFieldError(input, errorId, message) {
        const err = document.getElementById(errorId);
        const invalid = Boolean(message);
        input.classList.toggle("is-invalid", invalid);
        input.setAttribute("aria-invalid", invalid ? "true" : "false");
        if (err) {
          err.textContent = message || "";
          err.classList.toggle("is-visible", invalid);
        }
      }

      function clearStatus() {
        status.textContent = "";
        status.className = "form-note";
      }

      function validateForm() {
        const name = nameInput.value.trim();
        const email = emailInput.value.trim();
        const message = messageInput.value.trim();
        let firstInvalid = null;

        if (!name) {
          setFieldError(nameInput, "err-name", "Please enter your name.");
          firstInvalid = firstInvalid || nameInput;
        } else if (name.length < 2) {
          setFieldError(nameInput, "err-name", "Name must be at least 2 characters.");
          firstInvalid = firstInvalid || nameInput;
        } else {
          setFieldError(nameInput, "err-name", "");
        }

        if (!email) {
          setFieldError(emailInput, "err-email", "Please enter your email.");
          firstInvalid = firstInvalid || emailInput;
        } else if (!emailPattern.test(email)) {
          setFieldError(emailInput, "err-email", "Enter a valid email like you@brand.com.");
          firstInvalid = firstInvalid || emailInput;
        } else {
          setFieldError(emailInput, "err-email", "");
        }

        if (!message) {
          setFieldError(messageInput, "err-message", "Please enter a message.");
          firstInvalid = firstInvalid || messageInput;
        } else if (message.length < 10) {
          setFieldError(messageInput, "err-message", "Message must be at least 10 characters.");
          firstInvalid = firstInvalid || messageInput;
        } else {
          setFieldError(messageInput, "err-message", "");
        }

        return {
          ok: !firstInvalid,
          firstInvalid,
          name,
          email,
          message,
        };
      }

      [nameInput, emailInput, messageInput].forEach((field) => {
        field.addEventListener("input", () => {
          clearStatus();
          if (field.classList.contains("is-invalid")) {
            validateForm();
          }
        });
        field.addEventListener("focus", () => {
          if (window.gsap && !live.prefersReducedMotion()) {
            gsap.to(field, { borderColor: "#fbcfe8", duration: 0.25 });
          }
        });
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        const result = validateForm();
        if (!result.ok) {
          status.textContent = "Please fix the highlighted fields, then try again.";
          status.className = "form-note is-error";
          if (result.firstInvalid) result.firstInvalid.focus();
          return;
        }

        // No backend — draft a mailto. User must send from their email app.
        const subject = encodeURIComponent("Pure Zero contact from " + result.name);
        const body = encodeURIComponent(
          "Name: " + result.name + "\nEmail: " + result.email + "\n\n" + result.message
        );
        status.textContent =
          "Opening your email app with a drafted message. Nothing is sent until you press send there.";
        status.className = "form-note is-info";

        if (window.gsap && !live.prefersReducedMotion()) {
          gsap.fromTo(form, { y: 0 }, { y: -6, duration: 0.18, yoyo: true, repeat: 1, ease: "power1.inOut" });
        }

        window.location.href = "mailto:hello@dietsoda.example?subject=" + subject + "&body=" + body;
      });
    </script>
</body>
</html>
